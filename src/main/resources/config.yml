# Enable or disable debug logging for troubleshooting.
debug-mode: false

# Enable or disable sound effects when players vanish.
sound-enable: true

# The sound effect played when vanishing. Change this to any valid sound.
sound: 'AMBIENT_CAVE'

# Configuration for various actions that are disabled when a player is vanished.
disabled-actions:
  damage: true
  hunger: true
  mob-target: true
  silent-chest: true
  silent-ender-chest: true
  pressure-plates: true
  death-messages: true
  advancements: true
  player-push: true
  pickup-items: true

# Effects applied to the player when they are vanished.
vanish-effects:
  night-vision: true
  allow-flight: true

# Notifications shown to the player when their vanish status changes.
notifications:
  actionbar: true
  title: true

# Defines the color used in plugin messages for enhanced readability or thematic consistency.
plugin-color: 'BLUE'

# Boss bar shown to players while they are vanished.
bossbar:
  # Set to false to disable the vanish boss bar entirely.
  enabled: true
  # The text shown on the boss bar. Supports color codes (&).
  title: "&bYou are currently vanished"
  # The boss bar style: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
  style: 'SOLID'
