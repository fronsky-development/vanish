name: Bug Report
description: Report a problem with the Vanish plugin
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below as
        completely as possible. Before submitting, search existing issues to avoid duplicates.
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I am running the latest version of Vanish (`/vanish info`).
          required: true
        - label: I have searched existing issues and this is not a duplicate.
          required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Output of `/vanish info`.
      placeholder: "3.1.1"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the plugin does this bug relate to?
      options:
        - Vanish core (invisibility / join & quit)
        - Disabled actions (damage, hunger, mob target, etc.)
        - Silent containers
        - Boss bar indicator
        - Player head GUI
        - Commands / permissions
        - Configuration (config.yml / messages.yml)
        - ProtocolLib integration
        - PlaceholderAPI integration / placeholders
        - Dynmap integration
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: server-software
    attributes:
      label: Server software
      options:
        - Paper
        - Spigot
        - Purpur
        - Folia
        - Other (specify below)
    validations:
      required: true
  - type: input
    id: mc-version
    attributes:
      label: Minecraft version
      description: Must be 1.20 or newer (see README requirements).
      placeholder: "1.20.6"
    validations:
      required: true
  - type: input
    id: integrations
    attributes:
      label: Relevant integrations & versions
      description: Optional plugins involved — ProtocolLib, PlaceholderAPI, Dynmap, etc.
      placeholder: "ProtocolLib 5.4.0, PlaceholderAPI 2.12.2"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run '...'
        2. Do '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console logs / stack traces
      description: Paste any relevant console output. For long logs, use a paste service and link it here.
      render: shell
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the problem here.
    validations:
      required: false
