plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

def plugin_name = 'Vanish'
def plugin_group = 'nl.fronsky'
def plugin_version = '3.1.2'
// Oldest supported Minecraft version: used as compile API and as api-version in plugin.yml.
def spigot_version = '1.20'
def java_version = 17
def spigot_api = "org.spigotmc:spigot-api:${spigot_version}-R0.1-SNAPSHOT"

group = plugin_group
version = plugin_version

repositories {
    mavenCentral()
    // Third-party repositories may only serve their own group, so no artifact can come from an unexpected source.
    exclusiveContent {
        forRepository {
            maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        }
        filter { includeGroup 'org.spigotmc' }
    }
    exclusiveContent {
        forRepository {
            maven { url = 'https://repo.extendedclip.com/releases/' }
        }
        filter { includeGroup 'me.clip' }
    }
}

dependencies {
    // Provided by the server at runtime.
    compileOnly spigot_api

    // Optional integrations, provided by their own plugins at runtime.
    compileOnly 'net.dmulloy2:ProtocolLib:5.4.0'
    compileOnly 'me.clip:placeholderapi:2.12.3'

    // Shaded and relocated into the plugin jar by shadowJar.
    implementation 'org.bstats:bstats-bukkit:3.2.1'

    testImplementation spigot_api
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    constraints {
        // spigot-api 1.20 pulls in Guava 31.1, which has known vulnerabilities.
        compileOnly 'com.google.guava:guava:32.1.2-jre'
        testImplementation 'com.google.guava:guava:32.1.2-jre'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(java_version)
}

wrapper {
    gradleVersion = '9.8.1'
    distributionType = Wrapper.DistributionType.BIN
    // Official checksum of the distribution above; update both together.
    distributionSha256Sum = 'dce76f55f8e251a3a1f130eb120f30b3d271de2b76c9b0729d316b5a1b6dc01f'
}

def build_id = System.getenv('BUILD_ID') ?: new Date().format("yyyyMMdd-HHmmss")

tasks.register('generateBuildInfo') {
    def outDir = layout.buildDirectory.dir("generated/buildinfo")
    outputs.dir(outDir)
    doLast {
        def dir = outDir.get().asFile
        dir.mkdirs()
        def f = new File(dir, "vanish-build.properties")
        f.text = "version=${plugin_version}\n" +
                "buildId=${build_id}\n" +
                "builtAt=${new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")}\n"
    }
}

processResources {
    dependsOn tasks.named('generateBuildInfo')
    from(layout.buildDirectory.dir("generated/buildinfo")) {
        include "vanish-build.properties"
    }

    doFirst {
        Provider<Directory> buildDirectory = layout.buildDirectory.dir("resources/main")

        buildDirectory.get().asFile.listFiles().each {
            it.delete()
        }
    }

    def props = [plugin_name: plugin_name, plugin_main_class: "${plugin_group}.${plugin_name.toLowerCase()}.${plugin_name}Plugin", plugin_version: plugin_version, spigot_version: spigot_version, java_version: java_version]
    inputs.properties(props)
    filteringCharset = 'UTF-8'

    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.named('shadowJar') {
    archiveClassifier = ''
    // bStats refuses to start unless relocated; relocation also prevents clashes with other plugins.
    relocate 'org.bstats', 'nl.fronsky.vanish.libs.bstats'
    // Ships the license notice of the bundled bStats classes with the jar.
    from(rootProject.file('NOTICE')) {
        into 'META-INF'
    }
}

// The shaded jar is the only deliverable; a plain jar would be missing bStats.
tasks.named('jar') {
    enabled = false
}

test {
    useJUnitPlatform()
}
